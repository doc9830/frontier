# Signing key for the shell.
#
# It is committed on purpose: Android refuses to install an update signed by a
# different key, and this app updates itself, so losing the key would mean losing
# the ability to update. Regenerate it only if you also accept a reinstall
# (uninstall the app once, then install the new build).
storeFile=app/frontier-release.jks
storePassword=frontier-android
keyAlias=frontier
keyPassword=frontier-android
